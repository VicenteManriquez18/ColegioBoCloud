spring.application.name=servicio-academico

server.port=8084

# ─── Base de datos ─────────────────────────────────────────────────────────────
# Conexión a RDS PostgreSQL (AWS)
spring.datasource.url=jdbc:postgresql://pedidos360.cdkqqe6kw6u1.us-east-1.rds.amazonaws.com:5432/academico_db?sslmode=require
spring.datasource.username=postgres
# La contraseña se inyecta desde la variable de entorno DB_PASSWORD (nunca hardcodeada aquí)
spring.datasource.password=${DB_PASSWORD}

# Driver y Dialecto
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 'update' → crea/modifica tablas sin borrar datos existentes
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola para debugear
spring.jpa.show-sql=true

# ─── Seguridad — Azure AD JWT ──────────────────────────────────────────────────
# Valida la firma del token sin importar la versión (v1.0 o v2.0)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/4646e528-a2b6-4aac-b415-5b0ddd4897d8/discovery/v2.0/keys

# ─── Swagger/OpenAPI ───────────────────────────────────────────────────────────
springdoc.api-docs.path=/api/academico/v3/api-docs
springdoc.swagger-ui.enabled=false
