spring.application.name=apigateway

server.port=9090

# Ruta para servicio-usuarios (incluyendo auth y usuarios)
spring.cloud.gateway.routes[0].id=servicio-usuarios
spring.cloud.gateway.routes[0].uri=${SERVICIO_USUARIOS_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/usuarios/**,/api/auth/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=usuariosCB
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/usuarios
spring.cloud.gateway.routes[0].filters[1].name=RewritePath
spring.cloud.gateway.routes[0].filters[1].args.regexp=/api/(?<segment>.*)
spring.cloud.gateway.routes[0].filters[1].args.replacement=/api/${segment}

spring.cloud.gateway.routes[1].id=servicio-asistencia
spring.cloud.gateway.routes[1].uri=${SERVICIO_ASISTENCIA_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/asistencia/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=asistenciaCB
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/asistencia

spring.cloud.gateway.routes[2].id=servicio-matricula
spring.cloud.gateway.routes[2].uri=${SERVICIO_MATRICULA_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/matricula/**
spring.cloud.gateway.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[0].args.name=matriculaCB
spring.cloud.gateway.routes[2].filters[0].args.fallbackUri=forward:/fallback/matricula

# Ruta para servicio-academico
spring.cloud.gateway.routes[3].id=servicio-academico
spring.cloud.gateway.routes[3].uri=${SERVICIO_ACADEMICO_URL:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/academico/**
spring.cloud.gateway.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.name=academicoCB
spring.cloud.gateway.routes[3].filters[0].args.fallbackUri=forward:/fallback/academico

# Configuración Resilience4j para el Gateway
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s

# Configuración de Fallbacks (Redirección interna en el Gateway)
resilience4j.circuitbreaker.instances.usuariosCB.baseConfig=default
resilience4j.circuitbreaker.instances.matriculaCB.baseConfig=default
resilience4j.circuitbreaker.instances.asistenciaCB.baseConfig=default
resilience4j.circuitbreaker.instances.academicoCB.baseConfig=default
resilience4j.circuitbreaker.instances.reportesCB.baseConfig=default

# Configuración de Actuator para monitorear el Circuit Breaker
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# Configuración de Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.enable-spring-security=false

# Configuración de gateway routes para Swagger - URLs de los microservicios
springdoc.swagger-ui.urls[0].name=Servicio Usuarios
springdoc.swagger-ui.urls[0].url=/api/usuarios/v3/api-docs

springdoc.swagger-ui.urls[1].name=Servicio Asistencia
springdoc.swagger-ui.urls[1].url=/api/asistencia/v3/api-docs

springdoc.swagger-ui.urls[2].name=Servicio Matrícula
springdoc.swagger-ui.urls[2].url=/api/matricula/v3/api-docs

springdoc.swagger-ui.urls[3].name=Servicio Académico
springdoc.swagger-ui.urls[3].url=/api/academico/v3/api-docs

# Ruta para servicio-reportes
spring.cloud.gateway.routes[4].id=servicio-reportes
spring.cloud.gateway.routes[4].uri=${SERVICIO_REPORTES_URL:http://localhost:8085}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/reportes/**
spring.cloud.gateway.routes[4].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[4].filters[0].args.name=reportesCB
spring.cloud.gateway.routes[4].filters[0].args.fallbackUri=forward:/fallback/reportes

# Swagger UI entry para servicio-reportes
springdoc.swagger-ui.urls[4].name=Servicio Reportes
springdoc.swagger-ui.urls[4].url=/api/reportes/v3/api-docs

# Ruta para servicio-mensajeria
spring.cloud.gateway.routes[5].id=servicio-mensajeria
spring.cloud.gateway.routes[5].uri=${SERVICIO_MENSAJERIA_URL:http://localhost:8086}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/mensajes/**
spring.cloud.gateway.routes[5].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[5].filters[0].args.name=mensajeriaCB
spring.cloud.gateway.routes[5].filters[0].args.fallbackUri=forward:/fallback/mensajeria

resilience4j.circuitbreaker.instances.mensajeriaCB.baseConfig=default

# Swagger UI entry para servicio-mensajeria
springdoc.swagger-ui.urls[5].name=Servicio Mensajería
springdoc.swagger-ui.urls[5].url=/api/mensajes/v3/api-docs

