spring.application.name=servicio-reportes

server.port=8085

# ─── Base de datos ─────────────────────────────────────────────────────────────
# Conexión a RDS PostgreSQL (AWS)
spring.datasource.url=jdbc:postgresql://pedidos360.cdkqqe6kw6u1.us-east-1.rds.amazonaws.com:5432/reportes_db?sslmode=require
spring.datasource.username=postgres
# La contraseña se inyecta desde la variable de entorno DB_PASSWORD (nunca hardcodeada aquí)
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Seguridad — Azure AD JWT ──────────────────────────────────────────────────
# Valida la firma del token sin importar la versión (v1.0 o v2.0)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/4646e528-a2b6-4aac-b415-5b0ddd4897d8/discovery/v2.0/keys

# ─── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.jackson.default-property-inclusion=non_null

# ─── Swagger/OpenAPI ───────────────────────────────────────────────────────────
springdoc.api-docs.path=/api/reportes/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.proyecto.reportes=INFO
logging.level.org.springframework.amqp=DEBUG

# ─── URLs de Servicios Externos ────────────────────────────────────────────────
servicio.academico.url=${SERVICIO_ACADEMICO_URL:http://127.0.0.1:8084}
servicio.asistencia.url=${SERVICIO_ASISTENCIA_URL:http://127.0.0.1:8082}
servicio.matricula.url=${SERVICIO_MATRICULA_URL:http://127.0.0.1:8083}
